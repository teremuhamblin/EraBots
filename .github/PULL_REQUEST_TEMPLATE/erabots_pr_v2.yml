name: "🟩 EraBots v2.0 — Pull Request"
description: "Template officiel pour les Pull Requests du framework EraBots v2.0 (Quantum‑Era)"
title: "[PR v2.0] — "
labels: ["erabots", "v2.0", "pull-request"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # 🟩 EraBots v2.0 — Pull Request
        Merci d’utiliser le template officiel pour les PR du framework EraBots v2.0.
        Ce formulaire garantit la conformité aux protocoles Quantum‑Era et BlueSecurity.

  - type: textarea
    id: summary
    attributes:
      label: ✨ Résumé de la Pull Request
      description: >
        Décris clairement ce que fait cette PR : nouvelle fonctionnalité, correctif, refactor, mise à jour de documentation, optimisation, etc.
      placeholder: "Résumé opérationnel..."
    validations:
      required: true

  - type: checkboxes
    id: pr_type
    attributes:
      label: 🛠️ Type de PR
      options:
        - label: "Feature — Ajout d’un nouveau module ou capacité EraBots"
          checked: true
        - label: "Bugfix — Correction d’un dysfonctionnement"
          checked: true
        - label: "Refactor — Amélioration structurelle du code"
          checked: true
        - label: "Documentation — Mise à jour ou ajout de fichiers docs"
          checked: true
        - label: "Security — Patch BlueSecurity / durcissement"
          checked: true

  - type: textarea
    id: context
    attributes:
      label: 📘 Contexte / Problème adressé
      description: >
        Explique le problème initial, le besoin, ou la raison de cette PR.
      placeholder: "Contexte détaillé..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 🚀 Solution proposée
      description: >
        Décris précisément les changements apportés : modules modifiés, nouveaux fichiers, logique ajoutée, impact sur les bots, etc.
      placeholder: "Détails techniques de la solution..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        # 🔧 Modules EraBots v2.0 concernés

  - type: checkboxes
    id: core_modules
    attributes:
      label: Core v2.0
      options:
        - label: "Engine v2.0"
          checked: true
        - label: "EventBus v2.0"
          checked: true
        - label: "SessionManager v2.0"
          checked: true
        - label: "Config.yaml"
          checked: true
        - label: "Security / BlueSecurity v1.0"
          checked: true

  - type: checkboxes
    id: bots_standard
    attributes:
      label: Bots standards
      options:
        - label: "echo_bot.py"
          checked: true
        - label: "sample_bot.py"
          checked: true

  - type: checkboxes
    id: bots_agents
    attributes:
      label: Bots IA — AgentsEngineV2
      options:
        - label: "openai_agent.py (Text Agent)"
          checked: true
        - label: "voice_agent.py (Voice Agent)"
          checked: true
        - label: "sandbox_agent.py (Sandbox Agent)"
          checked: true

  - type: checkboxes
    id: bots_advanced
    attributes:
      label: Bots avancés — Quantum‑Era
      options:
        - label: "analysis_bot.py"
          checked: true
        - label: "ops_bot.py"
          checked: true
        - label: "security_bot.py (BlueSecurity B1 → B9)"
          checked: true
        - label: "realtime_agent.py (Streaming)"
          checked: true

  - type: textarea
    id: implementation_details
    attributes:
      label: 🧩 Détails d’implémentation
      description: >
        Liste les points clés : architecture, design, nouveaux endpoints, nouveaux handlers EventBus, modifications SessionManager, etc.
      placeholder: "Points techniques..."
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: 🧪 Tests & Validation
      description: >
        Décris les tests effectués : unitaires, intégration, end-to-end, scénarios manuels.
      placeholder: "Scénarios testés..."
    validations:
      required: true

  - type: checkboxes
    id: test_checklist
    attributes:
      label: Checklist de tests
      options:
        - label: "Tests unitaires ajoutés"
          checked: true
        - label: "Tests d’intégration ajoutés"
          checked: true
        - label: "Tests manuels effectués"
          checked: true
        - label: "Validation multi-bots (handoff / dispatch)"
          checked: true
        - label: "Validation AgentsEngineV2 (OpenAI Agents SDK)"
          checked: true

  - type: checkboxes
    id: impacts
    attributes:
      label: 📡 Impacts potentiels
      options:
        - label: "Performance"
          checked: true
        - label: "Sécurité / BlueSecurity"
          checked: true
        - label: "Compatibilité ascendante"
          checked: true
        - label: "Architecture interne"
          checked: true
        - label: "Bots v2.0"
          checked: true
        - label: "AgentsEngineV2"
          checked: true

  - type: textarea
    id: rollback
    attributes:
      label: 🔁 Plan de rollback
      description: >
        Décris comment revenir en arrière en cas de problème.
      placeholder: "Procédure de rollback..."
    validations:
      required: true

  - type: textarea
    id: final_summary
    attributes:
      label: 🟩 Résumé final (Quantum‑Era)
      description: "Synthèse opérationnelle de la PR."
      placeholder: "Résumé final..."
    validations:
      required: true

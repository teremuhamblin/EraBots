name: "🟦 EraBots v2.0 — Issue"
description: "Template officiel pour les issues du framework EraBots v2.0 (Quantum‑Era)"
title: "[EraBots v2.0] — "
labels: ["erabots", "v2.0", "issue"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # 🟦 Issue — EraBots v2.0
        Merci d'utiliser le template officiel EraBots v2.0.
        Remplissez les sections ci-dessous pour assurer un traitement optimal.

  - type: textarea
    id: description
    attributes:
      label: 📘 Description
      description: >
        Résume clairement le problème, la demande ou l’amélioration souhaitée.
        Indique le module concerné : Engine v2.0, EventBus, SessionManager, AgentsEngineV2, Bots v2.0, Security, etc.
        Explique l’impact sur le fonctionnement du framework.
      placeholder: "Description détaillée..."
    validations:
      required: true

  - type: checkboxes
    id: issue_type
    attributes:
      label: 🛠️ Type d’issue
      options:
        - label: "Feature — Nouveau module / nouvelle capacité EraBots"
        - label: "Bug — Dysfonctionnement dans un composant existant"
        - label: "Documentation — Mise à jour ou ajout dans les fichiers docs"

  - type: checkboxes
    id: checklist
    attributes:
      label: 📋 Checklist de conformité EraBots v2.0
      options:
        - label: "J’ai lu les protocoles du projet (.CLAUDE.md, copilot-instructions.md, AGENTS.md, README v2.0)"
        - label: "J’ai vérifié les modules existants pour éviter les doublons"
        - label: "J’ai consulté les issues précédentes"
        - label: "Cette issue apporte une valeur réelle au framework EraBots v2.0"

  - type: markdown
    attributes:
      value: |
        # 🤖 Modules EraBots v2.0 concernés

  - type: checkboxes
    id: core_modules
    attributes:
      label: 🔧 Core v2.0
      options:
        - label: "Engine v2.0"
        - label: "EventBus v2.0"
        - label: "SessionManager v2.0"
        - label: "Config.yaml"
        - label: "Security / BlueSecurity v1.0"

  - type: checkboxes
    id: bots_standard
    attributes:
      label: 🤖 Bots standards
      options:
        - label: "echo_bot.py"
        - label: "sample_bot.py"

  - type: checkboxes
    id: bots_agents
    attributes:
      label: 🤖 Bots IA — AgentsEngineV2
      options:
        - label: "openai_agent.py (Text Agent)"
        - label: "voice_agent.py (Voice Agent)"
        - label: "sandbox_agent.py (Sandbox Agent)"

  - type: checkboxes
    id: bots_advanced
    attributes:
      label: 🤖 Bots avancés — Quantum‑Era
      options:
        - label: "analysis_bot.py"
        - label: "ops_bot.py"
        - label: "security_bot.py (BlueSecurity B1 → B9)"
        - label: "realtime_agent.py (Streaming)"

  - type: checkboxes
    id: bug_section
    attributes:
      label: 🐞 Informations supplémentaires en cas de Bug
      options:
        - label: "J’ai ajouté des captures d’écran ou logs"
        - label: "J’ai détaillé les étapes pour reproduire le problème"
        - label: "J’ai proposé une piste de correction"

  - type: checkboxes
    id: technical_impact
    attributes:
      label: 🟪 Section technique EraBots v2.0
      options:
        - label: "Architecture interne"
        - label: "Dispatch intelligent"
        - label: "Handoff multi-bots"
        - label: "Sessions persistantes"
        - label: "EventBus (routing, topics, broadcast)"
        - label: "AgentsEngineV2 (OpenAI Agents SDK)"
        - label: "Sécurité (BlueSecurity)"
        - label: "Performance / optimisation"

  - type: checkboxes
    id: urgency
    attributes:
      label: 📡 Niveau d’urgence
      options:
        - label: "Critique — bloque le fonctionnement du framework"
        - label: "Important — impact notable"
        - label: "Normal — amélioration ou optimisation"
        - label: "Faible — cosmétique / documentation"

  - type: textarea
    id: final_summary
    attributes:
      label: 🟦 Résumé final (Quantum‑Era)
      description: "Synthèse finale de l’issue."
      placeholder: "Résumé opérationnel..."
    validations:
      required: true
